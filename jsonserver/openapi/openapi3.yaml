    quantra_CrossCurrencySwap:
      type: object
      description: 'Cross-currency swap: two `SwapLeg`s in two different currencies
        (400 when

        equal: two legs in one currency are a vanilla, OIS or basis swap), each

        with its own discounting (and forwarding) curve and its own principal

        exchanges, one paid and one received (`SwapLeg.pay_receive`; 400 when

        both legs take the same side). Any combination of coupon kinds is allowed

        (fixed/float, float/float, fixed/fixed). Priced as two QuantLib legs

        (coupons plus `SimpleCashFlow` exchanges), each NPV''d on its own curve and

        converted to the reporting currency at the as-of exchange rate implied by

        the FX spot and the two discount curves (see `CrossCurrencySwapResponse`).'
      properties:
        leg1:
          $ref: '#/components/schemas/quantra_SwapLeg'
        leg2:
          $ref: '#/components/schemas/quantra_SwapLeg'
      required:
      - leg1
      - leg2
      additionalProperties: false
    quantra_CrossCurrencySwapResponse:
      type: object
      description: 'Cross-currency swap pricing result. With, for leg i, L_i the leg''s
        flows

        in its own frame (coupons +, initial exchange -N_i at the schedule start,

        final exchange +N_i with the last coupon), D_i its discounting curve,

        s_i = -1 for `Pay` / +1 for `Receive`, S the spot rate (delivery on the

        spot date t_s) and DF_base / DF_quote the discounting curves of the base-

        and quote-currency legs:

        legs[i].npv           = s_i * CashFlows::npv(L_i, D_i)        [currency i]

        X                     = S * DF_quote(t_s) / DF_base(t_s)      [quote per base,
        as of today]

        legs[i].npv_reporting = legs[i].npv, * X or / X                [reporting
        currency]

        npv                   = legs[0].npv_reporting + legs[1].npv_reporting

        Fair quantities hold the other leg and every exchange fixed and solve the

        linear equation in the fixed rate / the spread with the leg''s annuity

        A_i = CashFlows::bps(coupons of leg i, D_i) / 1e-4 (exchanges excluded):

        fair_rate   = rate_f   - NPV[in the fixed leg''s ccy] / (s_f * A_f)

        fair_spread = spread_k - NPV[in leg k''s ccy]         / (s_k * A_k)

        (k = the floating leg of a fixed/float swap, `legs[1]` of a float/float

        one) so repricing at the fair value gives npv = 0 to rounding. These are

        QuantLib::VanillaSwap''s / OvernightIndexedSwap''s own fair-value formulas

        and the legs are built by the same code as the single-currency swap

        endpoints. Every value is as of the evaluation date (the curves''

        reference date); flows on that date are excluded, as for every swap.'
      properties:
        npv:
          type: number
          description: 'Total present value in `reporting_currency`, positive in favour
            of the

            reported party (the one whose `pay_receive` sides were given).'
        legs:
          type: array
          description: 'One result per leg, in request order (`leg1` then `leg2`):
            the leg''s

            NPV in its own currency and in the reporting currency, and its flows

            with `include_flows`.'
          items:
            $ref: '#/components/schemas/quantra_SwapLegResult'
        fair_rate:
          type: number
          description: 'Present iff exactly one leg has `FixedCoupons`: the fixed
            rate that

            zeroes `npv`, holding the other leg and every notional exchange fixed.

            Absent for float/float and fixed/fixed swaps.'
        fair_spread:
          type: number
          description: 'Present iff a leg has `IborCoupons` or `OvernightCoupons`
            (as on every

            swap endpoint): the spread on the floating leg of a fixed/float swap,

            or on `legs[1]` (`leg2`, by convention) of a float/float one, that

            zeroes `npv`, holding the other leg and every notional exchange fixed.

            Absent for fixed/fixed swaps.'
        fx_spot_used:
          type: number
          description: 'The spot rate the swap was priced with (quote units per base
            unit of

            the referenced spot, for delivery on `spot_date`).'
        fx_as_of_rate:
          type: number
          description: 'As-of exchange rate X = S * DF_quote(t_s) / DF_base(t_s) used
            to

            convert between the two leg currencies (quote units per base unit of

            the referenced spot).'
        spot_date:
          type: string
          description: 'Spot date of the referenced spot: the (adjusted) evaluation
            date

            advanced `spot_days` business days on its joint calendar, ISO.'
      required:
      - legs
      additionalProperties: false
    quantra_PriceCrossCurrencySwapResponse:
      type: object
      description: Response wrapper for multiple cross-currency swaps, in request
        order.
      properties:
        swaps:
          type: array
          items:
            $ref: '#/components/schemas/quantra_CrossCurrencySwapResponse'
      required:
      - swaps
      additionalProperties: false
