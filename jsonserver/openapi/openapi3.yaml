    quantra_CalibrateSwaptionModelRequest:
      type: object
      description: Request to calibrate a Hull-White swaption model.
      properties:
        pricing:
          $ref: '#/components/schemas/quantra_Pricing'
        model_id:
          type: string
          description: Model id inside pricing.models to calibrate. Must refer to
            a SwaptionModelSpec with model_type=HullWhiteLattice.
        calibration:
          $ref: '#/components/schemas/quantra_SwaptionHwCalibrationSpec'
      required:
      - pricing
      - model_id
      additionalProperties: false
    quantra_CalibrateSwaptionModelResponse:
      type: object
      description: Response from Hull-White swaption model calibration.
      properties:
        model_id:
          type: string
          description: Model id requested for calibration.
        hw_a:
          type: number
          description: Calibrated Hull-White mean reversion parameter "a".
        hw_sigma:
          type: number
          description: Calibrated Hull-White volatility parameter "sigma".
        rmse:
          type: number
          description: Root-mean-square error computed from calibration helper errors.
        num_helpers:
          type: integer
          description: Number of calibration helpers used (typically rows * cols).
          minimum: -2147483648
          maximum: 2147483647
        grid_rows:
          type: integer
          description: Number of expiry rows in the calibration grid.
          minimum: -2147483648
          maximum: 2147483647
        grid_cols:
          type: integer
          description: Number of tenor columns in the calibration grid.
          minimum: -2147483648
          maximum: 2147483647
        grid_points:
          type: integer
          description: Total number of grid points in the calibration grid.
          minimum: -2147483648
          maximum: 2147483647
      required:
      - model_id
      additionalProperties: false
    quantra_CalibrateSwaptionVolRequest:
      type: object
      description: 'Request to calibrate a SABR swaption volatility surface.


        Mirrors `/calibrate-swaption-model` (Hull-White) in shape: caller supplies

        a full pricing context plus a `vol_id` referencing the surface to calibrate.

        Discount/forwarding curve ids are explicit on the request (rather than

        inferred from a model spec, since SABR has no model) and follow the same

        convention as `VolQuerySpec` on `/sample-vol-surfaces`.'
      properties:
        pricing:
          $ref: '#/components/schemas/quantra_Pricing'
        vol_id:
          type: string
          description: 'Vol surface id inside `pricing.volatility.vol_surfaces`. Must
            reference a

            SwaptionVolSpec whose payload is SwaptionSabrCalibrateSpec; all other

            kinds (Constant, AtmMatrix2D, SmileCube3D, SabrParams) are rejected.'
        discounting_curve_id:
          type: string
          description: 'Discount curve id used to compute per-node ATM forwards F(expiry,
            tenor).

            Required: SABR calibrate is forward-aware and the request stands alone

            (no trade-side curve fallback like /price-swaption has).'
        forwarding_curve_id:
          type: string
          description: Forwarding curve id used to project the floating leg in F computation.
      required:
      - pricing
      - vol_id
      - discounting_curve_id
      - forwarding_curve_id
      additionalProperties: false
    quantra_SabrCalibrationDiagnostics:
      type: object
      description: 'Calibration-specific diagnostics. Populated only for SABR surfaces
        whose

        kind is SabrCalibrate. For SabrParams surfaces (and other kinds in future

        extensions) this sub-block is absent on the parent SwaptionVolDiagnostics.'
      properties:
        per_node_rmse:
          type: array
          description: Root-mean-square fit error per (expiry, tenor) node, row-major
            nExp*nTen.
          items:
            type: number
        per_node_max_abs_error:
          type: array
          description: Worst single-strike absolute error per (expiry, tenor) node,
            row-major nExp*nTen.
          items:
            type: number
        overall_rmse:
          type: number
          description: Aggregate RMSE across the entire cube.
        converged:
          type: boolean
          description: 'True iff every node converged to a stationary point (i.e.,
            end criteria

            is not None and not MaxIterations on any node).'
        iterations_per_node:
          type: array
          description: 'Iteration count per node. Sentinel -1 indicates "not exposed
            by the

            optimizer" — current QuantLib (1.41) does not expose this publicly from

            the SABR interpolator, so v1 always emits -1. Field is retained for

            schema forward-compatibility.'
          items:
            type: integer
            minimum: -2147483648
            maximum: 2147483647
        strikes:
          type: array
          description: 'Strike spreads used in calibration (rate units, e.g. -0.02
            = -200bp).

            Same vector applied at every (expiry, tenor) node.'
          items:
            type: number
        per_strike_fit_error:
          type: array
          description: 'Per-strike fit error (fitted - market) for each (expiry, tenor,
            strike).

            Row-major nExp*nTen*nStrikes.'
          items:
            type: number
      additionalProperties: false
    quantra_SwaptionVolDiagnostics:
      type: object
      description: 'Diagnostics block describing one swaption vol surface. Emitted
        opt-in by

        /sample-vol-surfaces and /price-swaption when include_diagnostics=true, and

        reused as the response body for the standalone /calibrate-swaption-vol

        endpoint.'
      properties:
        vol_id:
          type: string
          description: Matches Pricing.volatility.vol_surfaces[].id.
        kind:
          $ref: '#/components/schemas/quantra_enums_SwaptionVolKind'
        expiries:
          type: array
          description: Per-node grid axes, mirroring the surface's pillars.
          items:
            $ref: '#/components/schemas/quantra_Period'
        tenors:
          type: array
          items:
            $ref: '#/components/schemas/quantra_Period'
        n_expiries:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        n_tenors:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        forward_per_node:
          type: array
          description: 'Per-node forwards F(expiry, tenor), populated when handle
            is built.

            Row-major nExp*nTen.'
          items:
            type: number
        atm_vol_per_node:
          type: array
          description: Per-node ATM vols sigma(F) evaluated via Hagan. Row-major nExp*nTen.
          items:
            type: number
        time_to_expiry_per_node:
          type: array
          description: Time-to-expiry in years for each node. Row-major nExp*nTen.
          items:
            type: number
        alpha_per_node:
          type: array
          description: 'SABR parameters in effect at each node. For SabrParams these
            are the

            user-supplied values; for SabrCalibrate these are calibrator output.

            Row-major nExp*nTen, schema field order alpha, beta, rho, nu.'
          items:
            type: number
        beta_per_node:
          type: array
          items:
            type: number
        rho_per_node:
          type: array
          items:
            type: number
        nu_per_node:
          type: array
          items:
            type: number
        calibration:
          $ref: '#/components/schemas/quantra_SabrCalibrationDiagnostics'
        warnings:
          type: array
          description: Validation warnings. Empty when fit is healthy.
          items:
            type: string
      required:
      - vol_id
      additionalProperties: false
    quantra_CalibrateSwaptionVolResponse:
      type: object
      description: 'Response from /calibrate-swaption-vol: a single SwaptionVolDiagnostics

        block describing the calibrated surface. Wrapped in a thin envelope rather

        than using SwaptionVolDiagnostics as `root_type` directly so that future

        additions (status field, audit metadata, etc.) don''t break the schema —

        same pattern as CalibrateSwaptionModelResponse.'
      properties:
        vol_id:
          type: string
          description: 'Vol id requested for calibration. Echoed for client correlation,

            mirroring CalibrateSwaptionModelResponse.model_id.'
        diagnostics:
          $ref: '#/components/schemas/quantra_SwaptionVolDiagnostics'
      required:
      - vol_id
      - diagnostics
      additionalProperties: false
    quantra_CallabilityEntry:
      type: object
      description: 'One entry in a callable/puttable bond''s call schedule: on `date`
        the option

        holder (the issuer for a Call, the bondholder for a Put) may exercise at

        `price`.


        `price` is a CLEAN price per 100 of face — it maps to a QuantLib

        Callability::Price of type Clean (Bond::Price::Clean). Dirty-price call

        schedules are equally native in QuantLib, but this product ships Clean-only;

        a `price_type` selector is a documented future extension. `price` must be

        strictly positive.'
      properties:
        date:
          type: string
          description: Exercise date (YYYY-MM-DD).
        price:
          type: number
          description: Clean call/put price per 100 of face. Must be > 0.
        callability_type:
          $ref: '#/components/schemas/quantra_enums_CallabilityType'
      additionalProperties: false
    quantra_CallableFixedRateBond:
      type: object
      description: 'Callable (or puttable) fixed-rate bond. Mirrors the plain FixedRateBond

        coupon vocabulary (settlement_days, face_amount, single coupon rate,

        accrual_day_counter, payment_convention, redemption, issue_date, schedule)

        and adds a non-empty call schedule. Priced with a short-rate (Hull-White)

        model on a trinomial tree lattice. Per-period amortizing notionals are a

        documented future extension (QuantLib''s CallableFixedRateBond is

        constant-notional).'
      properties:
        settlement_days:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        face_amount:
          type: number
          description: 'Face amount. Presence-required and must be > 0 (a bare double
            would

            default to a silent zero face).'
        rate:
          type: number
        accrual_day_counter:
          $ref: '#/components/schemas/quantra_enums_DayCounter'
        payment_convention:
          $ref: '#/components/schemas/quantra_enums_BusinessDayConvention'
        redemption:
          type: number
        issue_date:
          type: string
        schedule:
          $ref: '#/components/schemas/quantra_Schedule'
        call_schedule:
          type: array
          description: 'Non-empty call/put schedule. Entries must carry strictly increasing

            dates, each after issue_date, and each with price > 0.'
          items:
            $ref: '#/components/schemas/quantra_CallabilityEntry'
      required:
