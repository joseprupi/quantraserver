      summary: Price Year-on-Year Inflation Cap/Floor
      description: Price year-on-year inflation caps, floors, and collars (QuantLib
        YoYInflationCapFloor) over a configured YoY inflation index/curve and a constant
        YoY optionlet volatility, using the Black, unit-displaced Black, or Bachelier
        engine selected by the vol spec.
      tags:
      - Inflation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quantra_PriceYearOnYearInflationCapFloorRequest'
      responses:
        '200':
          description: Successful pricing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quantra_PriceYearOnYearInflationCapFloorResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
  /price-callable-fixed-rate-bond:
    post:
      summary: Price Callable Fixed Rate Bond
      description: Calculate NPV, clean/dirty price, and settlement date for callable
        (or puttable) fixed-rate bonds (QuantLib CallableFixedRateBond) priced on
        a TreeCallableFixedRateBondEngine over a Hull-White short-rate model referenced
        by id (the same model mechanism as swaptions, with explicit or calibrated
        parameters). Option-adjusted spread is a documented future extension.
      tags:
      - Bonds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quantra_PriceCallableFixedRateBondRequest'
      responses:
        '200':
          description: Successful pricing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quantra_PriceCallableFixedRateBondResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
  /price-fx-forward:
    post:
      summary: Price FX Forward
      description: Calculate NPV in a reporting currency, fair forward rate, forward
        points and per-currency leg present values for outright FX forwards, from
        an FX spot (pricing.fx.spots) and one discount curve per currency, using the
        same spot-date discount-factor algebra as QuantLib's FxSwapRateHelper. No
        currency is inferred from curve or index ids.
      tags:
      - FX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quantra_PriceFxForwardRequest'
      responses:
        '200':
          description: Successful pricing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quantra_PriceFxForwardResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
  /price-cross-currency-swap:
    post:
      summary: Price Cross-Currency Swap
      description: 'Calculate the NPV in a reporting currency, each leg''s NPV in
        its own currency and in the reporting currency, the fair fixed rate (exactly
        one fixed leg) or the fair spread on leg2 (no fixed leg), and optional per-leg
        flows (coupons and notional exchanges) for cross-currency swaps: two SwapLeg
        entries in two currencies, each paying or receiving fixed, IBOR or compounded/averaged
        overnight coupons (FixedCoupons / IborCoupons / OvernightCoupons), discounted
        on its own curve, with initial and/or final principal exchanges, converted
        at the as-of exchange rate implied by an FX spot (pricing.fx.spots) and the
        two discount curves. QuantLib leg cash-flow primitives only (the same leg
        builder as the single-currency swap endpoints); no currency is inferred from
        curve or index ids.'
      tags:
      - FX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quantra_PriceCrossCurrencySwapRequest'
      responses:
        '200':
          description: Successful pricing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quantra_PriceCrossCurrencySwapResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
  /health:
    get:
      summary: Health Check
      description: Check if the API server is running.
      tags:
      - System
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /status:
    get:
      summary: Runtime Status
      description: Runtime diagnostics including gRPC channel state, uptime, and optional
        Envoy worker health aggregation.
      tags:
      - System
      responses:
        '200':
          description: Status response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /meta:
    get:
      summary: Service Metadata
      description: Service and build metadata including versions, git sha, endpoints,
        products, and dependency versions.
      tags:
      - System
      responses:
        '200':
          description: Metadata response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
