    quantra_FxForward:
      type: object
      description: 'Outright FX forward: at `maturity_date` one party delivers `base_notional`

        units of `base_currency` against `base_notional x forward_rate` units of

        `quote_currency`. Priced off the FX spot and the two discount curves named

        on the PriceFxForward wrapper; the engine never infers a currency from a

        curve or index id.


        Sign convention: `direction` is the side of the party whose NPV is

        reported and a positive NPV is in favour of that party. A BuyBase forward

        is worth more when the fair forward rises above `forward_rate`.'
      properties:
        base_currency:
          type: string
          description: 'ISO 4217 code of the base currency (three uppercase letters).
            One unit

            of it is exchanged for `forward_rate` units of `quote_currency`. Must

            equal the `base_currency` of the referenced FX spot. Required.'
        quote_currency:
          type: string
          description: 'ISO 4217 code of the quote currency. Must equal the `quote_currency`
            of

            the referenced FX spot (the engine never inverts a pair). Required.'
        base_notional:
          type: number
          description: 'Notional in base-currency units exchanged at maturity.

            Presence-required; must be finite and > 0.'
        forward_rate:
          type: number
          description: 'Contract (strike) rate, quote units per base unit, applied
            to

            `base_notional` to give the quote-currency amount exchanged at

            maturity. Presence-required; must be finite and > 0.'
        maturity_date:
          type: string
          description: 'Delivery date, ISO `YYYY-MM-DD`. Adjusted with the spot''s
            joint

            settlement calendar and business-day convention; the adjusted date

            must fall after the spot date (400 otherwise). Required.'
        direction:
          $ref: '#/components/schemas/quantra_enums_FxDirection'
      required:
      - base_currency
      - quote_currency
      - maturity_date
      additionalProperties: false
    quantra_FxForwardResponse:
      type: object
      description: 'FX forward pricing result. With S the spot rate, t_s the spot
        date, T the

        adjusted maturity, N the base notional, K the contract rate, sign = +1 for

        BuyBase / -1 for SellBase, and DF_b / DF_q the two discount curves:

        base_leg_pv  = sign * N * DF_b(T)              (base currency)

        quote_leg_pv = -sign * N * K * DF_q(T)         (quote currency)

        X            = S * DF_q(t_s) / DF_b(t_s)       (as-of exchange rate, quote
        per base)

        npv          = base_leg_pv * X + quote_leg_pv  (reporting = quote currency)

        = base_leg_pv + quote_leg_pv / X  (reporting = base currency)

        fair_forward_rate = X * DF_b(T) / DF_q(T)

        = S * [DF_b(T)/DF_b(t_s)] / [DF_q(T)/DF_q(t_s)]

        Repricing the forward at K = fair_forward_rate gives npv = 0. Every value
        is

        as of the evaluation date (the curves'' reference date), like the NPV of

        every other product.'
      properties:
        npv:
          type: number
          description: 'Present value in `reporting_currency`, positive in favour
            of the party

            whose `direction` was given.'
        fair_forward_rate:
          type: number
          description: 'Fair (zero-NPV) forward rate for the adjusted maturity, quote
            units per

            base unit.'
        forward_points:
          type: number
          description: '`fair_forward_rate - spot`, in price units of the pair (the
            forward

            points at this maturity, as an FX swap screen quotes them).'
        base_leg_pv:
          type: number
          description: 'Present value of the base-currency cash flow, in base currency

            (positive when the reported party receives it).'
        quote_leg_pv:
          type: number
          description: 'Present value of the quote-currency cash flow, in quote currency

            (negative when the reported party pays it).'
        spot_date:
          type: string
          description: 'Spot date used: the (adjusted) evaluation date advanced `spot_days`

            business days on the spot''s joint settlement calendar, ISO.'
        maturity_date:
          type: string
          description: 'Maturity date after adjustment with the spot''s calendar and

            business-day convention, ISO. The cash flows are discounted to it.'
        fx_spot_used:
          type: number
          description: 'The spot rate the forward was priced with (quote units per
            base unit,

            for delivery on `spot_date`), resolved from `pricing.fx.spots` or the

            referenced Fx quote.'
      additionalProperties: false
    quantra_PriceFxForwardResponse:
      type: object
      description: Response wrapper for multiple FX forwards, in request order.
      properties:
        fx_forwards:
          type: array
          items:
            $ref: '#/components/schemas/quantra_FxForwardResponse'
      required:
      - fx_forwards
      additionalProperties: false
    quantra_OisSwap:
      type: object
      description: 'Overnight indexed swap: a fixed leg against a compounded (or averaged)

        overnight leg, both `SwapLeg`s in one currency (400 otherwise), one paid

        and one received (`SwapLeg.pay_receive`; 400 when both take the same

        side). The legs name their own discounting and forwarding curves. Priced

        as two QuantLib legs on their discount curves: FixedRateLeg with the fixed

        leg''s own payment calendar and lag (`SwapLeg.payment_calendar` /

        `payment_lag`, presence-required on both legs of this endpoint: an OIS

        pays with the overnight calendar and lag) and OvernightLeg with the

        overnight conventions, the chains

        QuantLib::OvernightIndexedSwap builds, plus the notional exchanges when a

        leg asks for them (see `OisSwapResponse`).'
      properties:
        fixed_leg:
          $ref: '#/components/schemas/quantra_SwapLeg'
        overnight_leg:
          $ref: '#/components/schemas/quantra_SwapLeg'
      required:
      - fixed_leg
      - overnight_leg
      additionalProperties: false
    quantra_OisSwapResponse:
      type: object
      description: 'Overnight indexed swap pricing result. With, for leg i, L_i the
        leg''s

        flows in its own frame (coupons +, initial exchange -N_i at the schedule

        start, final exchange +N_i with the last coupon; no exchanges unless the

        leg asks for them), D_i its discounting curve and s_i = -1 for `Pay` /

        +1 for `Receive`:

        legs[i].npv           = s_i * CashFlows::npv(L_i, D_i)

        legs[i].npv_reporting = legs[i].npv                (one currency)

        npv                   = legs[0].npv + legs[1].npv

        `fair_rate` holds the overnight leg and every exchange fixed and solves

        the linear equation in the fixed rate with the fixed leg''s signed annuity

        B_0 = s_0 * CashFlows::bps(coupons of leg 0, D_0) (exchanges excluded):

        fair_rate = rate_0 - npv / (B_0 / 1e-4)

        which is QuantLib::OvernightIndexedSwap''s own fair-rate formula, so

        repricing at `fair_rate` gives npv = 0 to rounding. `fair_spread` is the

        mirror image on the overnight leg: with B_1 = s_1 * CashFlows::bps(coupons

        of leg 1, D_1),

        fair_spread = spread_1 - npv / (B_1 / 1e-4)

        which is QuantLib::OvernightIndexedSwap''s own fair-spread formula. Every

        value is as of the evaluation date (the curves'' reference date); flows on

        that date are excluded. Positive `npv` is in favour of the reported party.'
      properties:
        npv:
          type: number
          description: 'Total present value in the legs'' currency, positive in favour
            of the

            reported party.'
        fair_rate:
          type: number
          description: 'The fixed rate that zeroes `npv`, the overnight leg and every
            exchange

            held fixed. Absent when the fixed leg''s annuity is zero or the value

            is not finite.'
        fair_spread:
          type: number
          description: 'The spread on the overnight leg that zeroes `npv`, the fixed
            leg and

            every exchange held fixed (the compounded overnight rates unchanged).

            Present on every priced OIS whose overnight leg''s annuity is non-zero

            and the value finite, as for every swap endpoint: `fair_rate` iff

            exactly one leg carries `FixedCoupons`, `fair_spread` iff a leg

            carries `IborCoupons`, `OvernightCoupons` or `CmsCoupons`.'
        legs:
          type: array
          description: 'One result per leg, in request order (`fixed_leg` then

            `overnight_leg`): the leg''s signed NPV and, with `include_flows`, its

            flows. An overnight coupon''s `rate` is the compounded (or averaged)

            rate plus spread and `index_fixing` the fixing on its first fixing

            date.'
          items:
            $ref: '#/components/schemas/quantra_SwapLegResult'
      required:
      - legs
      additionalProperties: false
    quantra_PriceOisSwapResponse:
      type: object
      description: Response wrapper for multiple OIS swaps, in request order.
