          - $ref: '#/components/schemas/quantra_SwapHelper'
          - $ref: '#/components/schemas/quantra_BondHelper'
          - $ref: '#/components/schemas/quantra_OISHelper'
          - $ref: '#/components/schemas/quantra_DatedOISHelper'
          - $ref: '#/components/schemas/quantra_ZeroRatePoint'
          - $ref: '#/components/schemas/quantra_TenorBasisSwapHelper'
