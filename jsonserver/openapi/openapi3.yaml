      properties:
        amount:
          type: number
        fixing_date:
          type: string
        accrual_start_date:
          type: string
        accrual_end_date:
          type: string
        rate:
          type: number
      additionalProperties: false
    quantra_FlowNotional:
      type: object
      description: Notional exchange cash flow.
      properties:
        date:
          type: string
        amount:
          type: number
        discount:
          type: number
        price:
          type: number
      additionalProperties: false
    quantra_FlowsWrapper:
      type: object
      description: Wrapper for a single flow in a collection.
      properties:
        flow_type:
          $ref: '#/components/schemas/quantra_Flow'
        flow:
          anyOf:
          - $ref: '#/components/schemas/quantra_FlowInterest'
          - $ref: '#/components/schemas/quantra_FlowPastInterest'
          - $ref: '#/components/schemas/quantra_FlowNotional'
      additionalProperties: false
    quantra_Fixing:
      type: object
      description: Historical index fixing for seasoned instruments.
      properties:
        date:
          type: string
        value:
          type: number
      required:
      - date
      additionalProperties: false
    quantra_IndexDef:
      type: object
      description: Complete index definition. Registered once per request, referenced
        by id.
      properties:
        id:
          type: string
          description: Unique identifier (e.g., "EUR_6M", "USD_SOFR", "MY_CUSTOM_3M").
        name:
          type: string
          description: Human-readable name / family label (e.g., "Euribor", "SOFR").
        index_type:
          $ref: '#/components/schemas/quantra_IndexType'
        tenor:
          $ref: '#/components/schemas/quantra_Period'
        fixing_days:
          type: integer
          description: Fixing days (e.g., 2 for Euribor, 0 for SOFR/ESTR). Presence-required.
          minimum: -2147483648
          maximum: 2147483647
        calendar:
          $ref: '#/components/schemas/quantra_enums_Calendar'
        business_day_convention:
          $ref: '#/components/schemas/quantra_enums_BusinessDayConvention'
        day_counter:
          $ref: '#/components/schemas/quantra_enums_DayCounter'
        end_of_month:
          type: boolean
          description: 'End of month rule (IBOR only, ignored for overnight). Presence-required:

            absent-vs-false silently changes money-market schedule dates.'
        currency:
          type: string
          description: ISO currency code (e.g., "EUR", "USD", "GBP", "JPY").
        fixings:
          type: array
          description: Past fixings needed for seasoned instruments.
          items:
            $ref: '#/components/schemas/quantra_Fixing'
      required:
      - id
      - name
      additionalProperties: false
    quantra_IndexRef:
      type: object
      description: Reference to an IndexDef by its id.
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    quantra_FixedCoupons:
      type: object
      description: 'Fixed-rate coupons: `notional x rate x accrual` per period of
        the leg''s

        `schedule` with the leg''s `day_counter`, paid on the leg''s payment

        conventions (`SwapLeg`). The `FixedCoupons` member of `SwapLeg.coupons`:

        the fixed leg of `price-vanilla-swap`, `price-ois-swap`, a swaption

        underlying and either `price-cross-currency-swap` leg. (Named

        `SwapFixedLeg` before 0.9.0; before 0.10.0 the coupon table carried the

        schedule, notional and conventions that now live on the leg.)'
      properties:
        rate:
          type: number
          description: Annual coupon rate as a decimal (0.032 = 3.20%). May be negative.
      additionalProperties: false
    quantra_IborCoupons:
      type: object
      description: 'IBOR floating coupons: one fixing of `index` per period of the
        leg''s

        `schedule` (`fixing_days` before the accrual start, or at the accrual end

        with `in_arrears`), coupon `notional x (fixing + spread) x accrual` with

        the leg''s `day_counter`. The `IborCoupons` member of `SwapLeg.coupons`:

        the floating leg of `price-vanilla-swap` and a swaption underlying, both

        `price-basis-swap` legs, a `price-cross-currency-swap` leg. The index

        must be an IBOR index: an overnight index here is a 400 naming

        `OvernightCoupons`. (Named `SwapFloatingLeg` before 0.9.0.)'
      properties:
        index:
          $ref: '#/components/schemas/quantra_IndexRef'
        spread:
          type: number
          description: 'Additive spread over the index fixing, as a decimal (0.0005
            = 5 bp).

            Keeps a literal 0.0 default: zero is the market-standard value.'
        fixing_days:
          type: integer
          description: 'Fixing lag in business days before each accrual start. Absent
            = the

            index''s own `IndexDef.fixing_days` (QuantLib''s default for an IBOR

            leg); present => this value overrides it for the leg. Must be >= 0.

            Not read for a swaption underlying, which always fixes on the index''s

            own fixing days.'
          minimum: -2147483648
          maximum: 2147483647
        in_arrears:
          type: boolean
          description: 'When true the coupon fixes at the end of its accrual period
            (no

            convexity adjustment is priced: the zero-volatility pricer reads the

            shifted fixing). Rejected (400) on a swaption underlying.'
      required:
      - index
      additionalProperties: false
    quantra_CmsPricerSpec:
      type: object
      description: CMS coupon pricer configuration (`CmsCoupons.pricer`).
      properties:
        pricer_type:
          $ref: '#/components/schemas/quantra_enums_CmsPricerType'
        yield_curve_model:
          $ref: '#/components/schemas/quantra_enums_CmsYieldCurveModel'
        mean_reversion:
          type: number
          description: Mean reversion parameter used by TSR/Hagan-family pricers.
        hagan_lower_limit:
          type: number
          description: Numeric Hagan lower integration limit.
        hagan_upper_limit:
          type: number
          description: Numeric Hagan upper integration limit.
        hagan_precision:
          type: number
          description: Numeric Hagan integration precision.
        hagan_hard_upper_limit:
          type: number
          description: 'Numeric Hagan hard upper integration limit.

            If <= 0.0, QuantLib default hard upper limit is used.'
      additionalProperties: false
    quantra_CmsCoupons:
      type: object
      description: 'Constant-maturity swap-rate coupons. Coupon formula per period
        of the

        leg''s `schedule`: `notional x accrual x (gear x CMSRate + spread)` with

        the leg''s `day_counter`, optionally capped and floored. The `CmsCoupons`

        member of `SwapLeg.coupons`: the floating leg of `price-vanilla-swap` (a

        CMS swap is a vanilla swap whose floating leg carries CMS coupons).

        Rejected (400) on `price-ois-swap`, `price-basis-swap`,

        `price-cross-currency-swap` and a swaption underlying; a CMS leg takes no

        `payment_calendar` / `payment_lag` (400 when present). (Named

        `SwapCmsLeg` before 0.9.0.)'
      properties:
        swap_index_id:
          type: string
          description: Swap index conventions id from Pricing.swap_indices (e.g. "EUR_SWAP_6M").
        swap_tenor:
          $ref: '#/components/schemas/quantra_Period'
        swaption_vol_id:
          type: string
          description: Swaption volatility surface id from Pricing.vol_surfaces used
            by CMS pricer.
        fixing_days:
          type: integer
          description: Optional fixing days override; if negative, uses swap index
            spot_days.
          minimum: -2147483648
          maximum: 2147483647
        gear:
          type: number
          description: Coupon gearing multiplier.
        spread:
          type: number
          description: Coupon additive spread.
        pricer:
          $ref: '#/components/schemas/quantra_CmsPricerSpec'
        cap:
          type: number
          description: 'Optional cap strike. Present => every CMS coupon is capped
            at this rate

            (produces CappedFlooredCmsCoupons). Absent => uncapped.'
        floor:
          type: number
          description: 'Optional floor strike. Present => every CMS coupon is floored
            at this rate.

            Absent => unfloored. If both cap and floor are present, cap must be >=
            floor.'
      required:
      - swap_index_id
      - swap_tenor
      - swaption_vol_id
      additionalProperties: false
    quantra_OvernightCoupons:
      type: object
      description: 'Overnight floating coupons: the daily fixings of an overnight
        `index`

        compounded (or averaged) over each period of the leg''s `schedule`, paid

        with the leg''s `payment_convention` / `payment_calendar` / `payment_lag`,

        with the lookback / lockout / observation-shift conventions of the

        market. The coupons take the index''s own day counter (the leg''s

        `day_counter` is accepted but not read, as QuantLib''s OvernightIndexedSwap

        does). The `OvernightCoupons` member of `SwapLeg.coupons`: the overnight

        leg of `price-ois-swap` and a swaption underlying, a `price-basis-swap`

        leg, a `price-cross-currency-swap` leg (all built by the same code). The

        index must be an overnight index: an IBOR index here is a 400 naming

        `IborCoupons`. (Named `OisFloatingLeg` before 0.9.0; before 0.10.0 it

        carried the payment calendar and lag that now live on the leg.)'
      properties:
        index:
          $ref: '#/components/schemas/quantra_IndexRef'
        spread:
          type: number
          description: 'Spread over the compounded/averaged overnight rate. Keeps
            a literal 0.0

            default on purpose: zero is the genuine market-standard value, not a

            convention that could silently diverge.'
        averaging_method:
          $ref: '#/components/schemas/quantra_enums_RateAveragingType'
        lookback_days:
          type: integer
          description: 'Fixing lookback in business days. Presence-required; must
            be >= 0; 0 =

            no lookback (the index''s own fixing delay applies; QuantLib encodes this

            as Null, not as a zero-day lookback).'
          minimum: -2147483648
          maximum: 2147483647
        lockout_days:
          type: integer
          description: 'Lockout (rate-cutoff) days at period end. Presence-required;
            must be

            >= 0; 0 = no lockout.'
          minimum: -2147483648
          maximum: 2147483647
        apply_observation_shift:
          type: boolean
          description: 'Whether the observation-shift convention applies to the lookback.

            Presence-required.'
        telescopic_value_dates:
          type: boolean
          description: 'Performance toggle for QuantLib''s telescopic value-dates
            optimization,

            not a market convention; keeps a literal false default on purpose.'
      required:
      - index
      additionalProperties: false
    quantra_SwapLegFlow:
      type: object
      description: 'One cash flow of a swap leg (`SwapLegResult.flows` and the zero-coupon
        /

        inflation swap flow lists).'
      properties:
        payment_date:
          type: string
        accrual_start_date:
          type: string
        accrual_end_date:
          type: string
        amount:
          type: number
        accrual_year_fraction:
          type: number
          description: Accrual year fraction used by the coupon.
        gearing:
          type: number
          description: Coupon gearing multiplier (1.0 for fixed coupons).
        discount:
          type: number
        present_value:
          type: number
        fixing_date:
          type: string
          description: Floating leg metadata. For overnight coupons this may not represent
            the compounded effective coupon rate.
        index_fixing:
          type: number
          description: Underlying index fixing. For CMS coupons this is the CMS swap-rate
            fixing.
        cms_swap_rate:
          type: number
          description: CMS swap-rate fixing for a CMS coupon. Absent for non-CMS coupons.
        spread:
          type: number
        rate:
          type: number
          description: 'Coupon rate: fixed-leg rate or effective floating coupon rate.'
        kind:
          $ref: '#/components/schemas/quantra_enums_SwapFlowKind'
      additionalProperties: false
    quantra_SwapLeg:
      type: object
      description: 'One leg of a swap: a coupon stream in one currency, discounted
        on its own

        curve, with its own principal exchanges, paid or received by the party

        whose NPV is reported. The fields every coupon kind shares (notional,

        schedule, day count, payment conventions) live on the leg, as in the

        FpML / ORE leg model; `coupons` holds only what is specific to the kind.

        This is the leg model of every swap endpoint:

        `VanillaSwap`, `OisSwap`, `BasisSwap` (one currency, no spot) and

        `CrossCurrencySwap` (two currencies) are each two `SwapLeg`s under

        role-named fields, and a swaption underlying is a `VanillaSwap` or an

        `OisSwap` made of them.


        Principal exchanges follow the leg: the party that RECEIVES the leg''s

        coupons PAYS the leg''s notional on the schedule''s start date (initial

        exchange) and RECEIVES it with the last coupon (final exchange). In the

        leg''s own frame the flows are therefore coupons +, initial exchange

        -notional, final exchange +notional; `pay_receive` then applies the side:

        the payer of the coupons receives the initial exchange and pays the final

        one.'
      properties:
        pay_receive:
          $ref: '#/components/schemas/quantra_enums_PayReceive'
        currency:
          type: string
          description: 'ISO 4217 code of the leg''s currency (three uppercase letters).
            A

            floating leg''s index must carry the same `IndexDef.currency` (400

            otherwise). The two legs of a vanilla, OIS or basis swap must be in

            one currency, the two legs of a cross-currency swap in two. Required.'
        notional:
          type: number
          description: 'Constant notional of the coupons and of the principal exchanges.

            Presence-required and must be > 0 unless the per-period `notionals`

            vector is supplied (then optional). A bare double would default to a

            silent zero notional.'
        notionals:
          type: array
          description: 'Optional per-period notionals, one entry per coupon period
            in schedule

            order, each > 0. Present => amortizing / step-up leg (overrides

            `notional` for the coupons; the first entry is the exchanged

            notional); absent => constant `notional`. Accepted on the legs of

            `price-vanilla-swap`; rejected (400) on `price-ois-swap`,

            `price-basis-swap`, `price-cross-currency-swap` and a swaption

            underlying.'
          items:
            type: number
        schedule:
          $ref: '#/components/schemas/quantra_Schedule'
        day_counter:
          $ref: '#/components/schemas/quantra_enums_DayCounter'
        payment_convention:
          $ref: '#/components/schemas/quantra_enums_BusinessDayConvention'
        payment_calendar:
          $ref: '#/components/schemas/quantra_enums_Calendar'
        payment_lag:
          type: integer
          description: 'Payment lag in business days (on `payment_calendar`) between
            each

            accrual end and its payment. Absent = 0: pay on the adjusted accrual

            end. Presence-required on both legs of `price-ois-swap` (QuantLib''s

            OvernightIndexedSwap applies one lag to both legs; the leg model makes

            it a per-leg convention); optional elsewhere; rejected with

            `CmsCoupons` (400 when present). Must be >= 0.'
          minimum: -2147483648
          maximum: 2147483647
        coupons_type:
          $ref: '#/components/schemas/quantra_SwapCoupons'
        coupons:
          description: 'What the leg pays each period (see `SwapCoupons`): the kind-specific

            fields only (rate; index, spread, fixing...). Required; the tag

            `coupons_type` is required with it.'
          anyOf:
          - $ref: '#/components/schemas/quantra_FixedCoupons'
          - $ref: '#/components/schemas/quantra_IborCoupons'
          - $ref: '#/components/schemas/quantra_OvernightCoupons'
          - $ref: '#/components/schemas/quantra_CmsCoupons'
        discounting_curve:
          type: string
          description: 'Id of the curve in `pricing.rates.curves` that discounts every
            flow of

            this leg (coupons and exchanges). For a collateralised cross-currency

            trade, the currency''s collateral-adjusted curve. A swaption underlying

            needs one discount curve: both of its legs must name the same id.

            Required.'
        forwarding_curve:
          type: string
          description: 'Id of the curve in `pricing.rates.curves` the floating index
            projects

            off (for `CmsCoupons`, the curve the swap index''s IBOR leg projects

            off). Required with `IborCoupons` / `OvernightCoupons` / `CmsCoupons`

            (400 when missing), rejected with `FixedCoupons` (400 when present: a

            fixed leg projects nothing).'
        initial_exchange:
          type: boolean
          description: 'Whether the leg''s notional is exchanged on its schedule''s
            start date

            (paid by the receiver of the leg''s coupons). Presence-required on

            `price-cross-currency-swap`; on the single-currency endpoints absent =

            false (an explicit `true` is priced: the exchange becomes a

            NotionalExchange flow of the leg). Rejected when true on a swaption

            underlying.'
        final_exchange:
          type: boolean
          description: 'Whether the leg''s notional is exchanged on the last coupon''s
            payment

            date (received by the receiver of the leg''s coupons). Same presence

            rule as `initial_exchange`.'
      required:
      - currency
      - schedule
      - coupons
      - discounting_curve
      additionalProperties: false
    quantra_SwapLegResult:
      type: object
      description: Result of one swap leg (`legs` of a swap response, request order).
      properties:
        npv:
          type: number
          description: 'Present value of the leg (coupons and exchanges) in the leg''s
            own

            currency, signed from the reported party''s view: the leg''s own-frame

            value (as the receiver of its coupons sees it) times -1 when the party

            pays the leg (`Pay`) and +1 when it receives it (`Receive`). A paid leg

            is therefore negative only when it is worth paying for: paying a 2.55%

            fixed leg (with its exchanges) on a 3% curve is in the payer''s favour

            and positive. The swap''s `npv` is the sum of its legs'' values.'
        npv_reporting:
          type: number
          description: '`npv` converted to the swap''s reporting currency at the as-of
            exchange

            rate. Equal to `npv` on a single-currency swap (vanilla, OIS, basis),

            whose reporting currency is the legs'' currency.'
        flows:
          type: array
          description: 'Future flows of the leg in payment order (`include_flows`
            only), in

            the leg''s own frame: coupon amounts positive, the initial exchange

            -notional, the final exchange +notional; `kind` tells them apart. The

            sum of their `present_value`s is `npv / s` (s = -1 for `Pay`, +1 for

            `Receive`). For an overnight coupon `rate` is the compounded rate (plus

            spread) and `index_fixing` the fixing on the coupon''s first fixing

            date; for a CMS coupon `index_fixing` and `cms_swap_rate` are the CMS

            swap-rate fixing.'
          items:
            $ref: '#/components/schemas/quantra_SwapLegFlow'
      additionalProperties: false
    quantra_BasisSwap:
      type: object
      description: 'Basis swap: two floating `SwapLeg`s in one currency (400 otherwise),
        e.g.

        3M vs 6M IBOR or IBOR vs overnight, one paid and one received

        (`SwapLeg.pay_receive`; 400 when both take the same side). Each leg''s

        `coupons` is `IborCoupons` or `OvernightCoupons`; the legs name their own

        discounting and forwarding curves (the usual multi-curve setup discounts

        both on the OIS curve and projects each on its tenor curve). Priced as two

        QuantLib legs (IborLeg with a zero-volatility Black pricer / OvernightLeg)

        on their discount curves, plus the notional exchanges when a leg asks for

        them (see `BasisSwapResponse`).'
      properties:
        leg1:
          $ref: '#/components/schemas/quantra_SwapLeg'
        leg2:
          $ref: '#/components/schemas/quantra_SwapLeg'
      required:
      - leg1
      - leg2
      additionalProperties: false
    quantra_BasisSwapResponse:
      type: object
      description: 'Basis swap pricing result. With, for leg i, L_i the leg''s flows
        in its

        own frame (coupons +, initial exchange -N_i at the schedule start, final

        exchange +N_i with the last coupon; no exchanges unless the leg asks for

        them), D_i its discounting curve and s_i = -1 for `Pay` / +1 for

        `Receive`:

        legs[i].npv           = s_i * CashFlows::npv(L_i, D_i)

        legs[i].npv_reporting = legs[i].npv                (one currency)

        npv                   = legs[0].npv + legs[1].npv

        `fair_spread` holds the other leg and every exchange fixed and solves the

        linear equation in the spread of leg k with that leg''s signed annuity

        B_k = s_k * CashFlows::bps(coupons of leg k, D_k) (exchanges excluded):

        fair_spread = spread_k - npv * 1e-4 / B_k

        so repricing leg k at `fair_spread` gives npv = 0 to rounding. Every

        value is as of the evaluation date (the curves'' reference date); flows on

        that date are excluded. Positive `npv` is in favour of the reported party.'
      properties:
        npv:
          type: number
          description: 'Total present value in the legs'' currency, positive in favour
            of the

            reported party.'
        fair_spread:
          type: number
          description: 'Par spread of the leg that carries the request''s spread,
            the other

            leg''s spread and every exchange held fixed: leg k = `leg1` when only

            `leg1.coupons.spread` is non-zero, `leg2` otherwise (both spreads

            zero or both non-zero: `leg2`, the quoted leg by market convention).

            Absent when that leg''s annuity is zero or the value is not finite.'
        legs:
          type: array
          description: 'One result per leg, in request order (`leg1` then `leg2`):
            the leg''s

            signed NPV and, with `include_flows`, its flows.'
          items:
            $ref: '#/components/schemas/quantra_SwapLegResult'
      required:
      - legs
      additionalProperties: false
    quantra_PriceBasisSwapResponse:
      type: object
      description: Response wrapper for multiple basis swaps, in request order.
      properties:
        swaps:
          type: array
          items:
            $ref: '#/components/schemas/quantra_BasisSwapResponse'
      required:
      - swaps
      additionalProperties: false
