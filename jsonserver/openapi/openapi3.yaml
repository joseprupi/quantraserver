      properties:
        base:
          $ref: '#/components/schemas/quantra_IrVolBaseSpec'
        expiries:
          type: array
          items:
            $ref: '#/components/schemas/quantra_Period'
        tenors:
          type: array
          items:
            $ref: '#/components/schemas/quantra_Period'
        alpha:
          $ref: '#/components/schemas/quantra_QuoteMatrix2D'
        beta:
          $ref: '#/components/schemas/quantra_QuoteMatrix2D'
        rho:
          $ref: '#/components/schemas/quantra_QuoteMatrix2D'
        nu:
          $ref: '#/components/schemas/quantra_QuoteMatrix2D'
      additionalProperties: false
    quantra_SwaptionSabrCalibrateSpec:
      type: object
      description: 'SABR calibrate swaption volatility.


        Strike axis interpretation: `strikes` are spreads from the per-node ATM

        forward (rate units, e.g. -0.02 = -200bp). The same spread vector applies

        at every (expiry, tenor) node, matching QuantLib''s XabrSwaptionVolatilityCube

        API. 0.0 spread (true ATM) is not required to be in the grid — per-node ATM

        vols are interpolated from the user grid at spread=0.


        `vols` is row-major nExp*nTen*nStrikes; values are absolute market vols.


        `weights` is rejected in v1 — set `vega_weighted_smile_fit=true` for

        vega-weighted fitting instead. Per-strike non-uniform weights are not

        exposed by QuantLib 1.41''s calibrator.'
      properties:
        base:
          $ref: '#/components/schemas/quantra_IrVolBaseSpec'
        expiries:
          type: array
          items:
            $ref: '#/components/schemas/quantra_Period'
        tenors:
          type: array
          items:
            $ref: '#/components/schemas/quantra_Period'
        strikes:
          type: array
          items:
            type: number
        vols:
          $ref: '#/components/schemas/quantra_QuoteTensor3D'
        beta_fixed:
          type: boolean
        beta_value:
          type: number
        weights:
          $ref: '#/components/schemas/quantra_QuoteTensor3D'
        vega_weighted_smile_fit:
          type: boolean
          description: 'When true, the SABR calibrator weights residuals by Black
            vega. This is

            the standard "vega-weighted smile fit" QL flag (cube-level, not per

            strike).'
      additionalProperties: false
    quantra_SwaptionVolSpec:
      type: object
      description: Swaption volatility specification.
