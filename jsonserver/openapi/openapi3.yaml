          - $ref: '#/components/schemas/quantra_SwaptionVolSmileCubeSpec'
          - $ref: '#/components/schemas/quantra_SwaptionSabrParamsSpec'
          - $ref: '#/components/schemas/quantra_SwaptionSabrCalibrateSpec'
      additionalProperties: false
