    quantra_ZeroCouponSwap:
      type: object
      description: 'Zero-coupon interest rate swap (QuantLib::ZeroCouponSwap). Exchanges
        a

        single fixed cashflow at maturity against a single compounded-floating

        cashflow. The fixed side is quoted EITHER as a known fixed payment amount

        OR as a fixed rate compounded over the contract life.'
      properties:
        swap_type:
          $ref: '#/components/schemas/quantra_enums_SwapType'
        base_nominal:
          type: number
          description: 'Base notional prior to compounding. Presence-required and
            must be > 0

            (a bare double would default to a silent zero notional).'
        start_date:
          type: string
          description: Contract start date (ISO yyyy-mm-dd).
        maturity_date:
          type: string
          description: Contract maturity / single-payment date (ISO yyyy-mm-dd).
        fixed_payment:
          type: number
          description: 'Fixed-payment form: the known fixed cash flow N^FIX. Optional;
            presence

            selects this quoting form. Exactly one of `fixed_payment` or the

            `fixed_rate`+`fixed_rate_day_counter` pair must be supplied.'
        fixed_rate:
          type: number
          description: 'Fixed-rate form: the fixed rate R compounded over the contract
            life as

            N^FIX = N[(1+R)^alpha - 1], alpha the fixed_rate_day_counter year

            fraction between start and maturity. Optional; presence selects this

            quoting form. QuantLib''s ZeroCouponSwap rate constructor takes only the

            rate and its day counter (compounding is implicitly annual and there is

            no coupon frequency), so no compounding/frequency fields are exposed.'
        fixed_rate_day_counter:
          $ref: '#/components/schemas/quantra_enums_DayCounter'
        index:
          $ref: '#/components/schemas/quantra_IndexRef'
        payment_calendar:
          $ref: '#/components/schemas/quantra_enums_Calendar'
        payment_convention:
          $ref: '#/components/schemas/quantra_enums_BusinessDayConvention'
        payment_delay:
          type: integer
          description: Number of business days the payment is delayed after maturity.
          minimum: -2147483648
          maximum: 2147483647
      required:
      - index
      additionalProperties: false
    quantra_PriceZeroCouponSwap:
      type: object
      description: Single zero-coupon swap pricing context.
      properties:
        zero_coupon_swap:
          $ref: '#/components/schemas/quantra_ZeroCouponSwap'
        discounting_curve:
          type: string
          description: Reference to curve in pricing.rates.curves for discounting
            by id.
        forwarding_curve:
          type: string
          description: 'Reference to curve in pricing.rates.curves for floating-leg
            forward

            rates by id.'
      additionalProperties: false
    quantra_PriceZeroCouponSwapRequest:
