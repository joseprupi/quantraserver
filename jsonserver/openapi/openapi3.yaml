    quantra_SwaptionResponse:
      type: object
      description: Swaption pricing response with NPV, Greeks, and diagnostics.
      properties:
        npv:
          type: number
          description: Present value of the swaption under the selected model and
            market inputs.
        implied_volatility:
          type: number
          description: 'Implied volatility reported by the engine. For non-constant
            vol setups this may be a best-effort value.

            Absent when the engine provides none.'
        atm_forward:
          type: number
          description: 'ATM forward swap rate used for pricing diagnostics. Present
            only with

            swaption_pricing_details.'
        annuity:
          type: number
          description: 'Underlying swap annuity (PV01-style quantity). Present only
            with

            swaption_pricing_details.'
        delta:
          type: number
          description: 'Analytic forward delta (swaption_pricing_details): change
            in NPV for a 1bp

            move of the forward swap rate, annuity held fixed (Black/Bachelier

            deltaForward x annuity x 1e-4). Currency per bp. Absent unless

            swaption_pricing_details is set (the rebump path does not compute it).'
        vega:
          type: number
          description: 'Vega: change in NPV for a 1bp (1e-4) move of the quoted volatility

            (lognormal vol for Black, normal vol for Bachelier). Currency per bp of
            vol.

            swaption_pricing_details: analytic (calculator vega x annuity x 1e-4).

            swaption_pricing_rebump: central difference of a +/-1bp vol bump.

            When both flags are set the rebump value is reported. Absent when neither

            flag is set.'
        gamma:
          type: number
          description: 'Gamma per bp^2. swaption_pricing_details: analytic d2NPV/dF2
            of the forward

            swap rate x 1e-8, annuity held fixed. swaption_pricing_rebump: second

            difference of a +/-1bp parallel curve bump (npvUp - 2 npv + npvDown).

            When both flags are set the rebump value is reported. Absent when neither

            flag is set.'
        theta:
          type: number
          description: 'Theta in currency per calendar day. swaption_pricing_details:
            pure time

            decay of the option premium with forward, volatility and annuity held
            fixed

            (-1/2 sigma^2 F^2 Gamma for Black, -1/2 sigma_N^2 Gamma for Bachelier,

            per year, divided by 365). swaption_pricing_rebump: NPV(as_of + 1 calendar

            day) - NPV(as_of) from a full market roll. When both flags are set the

            rebump value is reported. Absent when neither flag is set.'
        dv01:
          type: number
          description: 'DV01 in currency per bp. swaption_pricing_details: equals
            `delta` (forward

            rate moved 1bp, annuity held fixed). swaption_pricing_rebump: central

            difference of a +/-1bp parallel bump of the discounting and forwarding

            curves (forward and annuity both move). When both flags are set the rebump

            value is reported. Absent when neither flag is set.'
        used_volatility:
          type: number
          description: Volatility actually queried from the resolved vol surface.
        used_option_expiry:
          type: string
          description: Option expiry date used by surface lookup (ISO date).
        used_swap_tenor:
          type: string
          description: Swap tenor descriptor used by lookup (e.g., date range).
        used_strike:
          type: number
          description: Strike used to query the volatility structure.
        used_atm_forward:
          type: number
          description: 'ATM forward used when smile conventions need ATM anchoring.
            Absent when the

            vol surface carries no ATM levels.'
        used_strike_kind:
          $ref: '#/components/schemas/quantra_enums_SwaptionStrikeKind'
        used_spread_from_atm:
          type: number
          description: 'Difference between used strike and cube ATM level. Absent
            unless the

            surface uses spread-from-ATM strikes and an ATM level is available.'
        used_cube_node_atm:
          type: number
          description: ATM level retrieved from cube node. Absent when no ATM level
            is available.
        vol_kind:
          $ref: '#/components/schemas/quantra_enums_SwaptionVolKind'
        used_model_param_mode:
          $ref: '#/components/schemas/quantra_enums_ModelParamMode'
        used_hw_a:
          type: number
          description: Effective Hull-White mean reversion "a" used by pricing. Absent
            when model is not HullWhiteLattice.
        used_hw_sigma:
          type: number
          description: Effective Hull-White sigma used by pricing. Absent when model
            is not HullWhiteLattice.
        used_hw_rmse:
          type: number
          description: Calibration RMSE for inline-calibrated Hull-White. Absent when
            no inline calibration.
        used_hw_num_helpers:
          type: integer
          description: Number of calibration helpers for inline-calibrated Hull-White.
            Absent when no inline calibration.
          minimum: -2147483648
          maximum: 2147483647
        used_hw_grid_rows:
          type: integer
          description: Calibration grid rows for inline-calibrated Hull-White. Absent
            when no inline calibration.
          minimum: -2147483648
          maximum: 2147483647
        used_hw_grid_cols:
          type: integer
          description: Calibration grid columns for inline-calibrated Hull-White.
            Absent when no inline calibration.
          minimum: -2147483648
          maximum: 2147483647
        used_hw_grid_points:
          type: integer
          description: Calibration grid points for inline-calibrated Hull-White. Absent
            when no inline calibration.
          minimum: -2147483648
          maximum: 2147483647
      additionalProperties: false
