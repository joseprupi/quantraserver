openapi: 3.0.3
info:
  title: Quantra Pricing API
  description: "\n## QuantLib-powered Financial Instrument Pricing API\n\nQuantra\
    \ provides a high-performance JSON HTTP API for pricing financial instruments\
    \ using the QuantLib library.\n\n### Supported Products\n\n| Product | Endpoint\
    \ | Description |\n|---------|----------|-------------|\n| Fixed Rate Bond | `/price-fixed-rate-bond`\
    \ | Price fixed coupon bonds |\n| Floating Rate Bond | `/price-floating-rate-bond`\
    \ | Price floating rate notes |\n| Vanilla Swap | `/price-vanilla-swap` | Price\
    \ interest rate swaps |\n| Zero Coupon Inflation Swap | `/price-zero-coupon-inflation-swap`\
    \ | Price zero-coupon inflation swaps |\n| Year-on-Year Inflation Swap | `/price-year-on-year-inflation-swap`\
    \ | Price year-on-year inflation swaps |\n| OIS Swap | `/price-ois-swap` | Price\
    \ overnight indexed swaps |\n| Basis Swap | `/price-basis-swap` | Price two-floating-leg\
    \ basis swaps |\n| FRA | `/price-fra` | Price forward rate agreements |\n| Cap/Floor\
    \ | `/price-cap-floor` | Price interest rate caps and floors |\n| Swaption | `/price-swaption`\
    \ | Price swaptions |\n| CDS | `/price-cds` | Price credit default swaps |\n|\
    \ Bootstrap Curves | `/bootstrap-curves` | Bootstrap yield curves and extract\
    \ rates |\n| Bootstrap Inflation Curves | `/bootstrap-inflation-curves` | Bootstrap\
    \ inflation curves and extract zero/YoY rates |\n| Vol Surface Sampler | `/sample-vol-surfaces`\
    \ | Sample volatility surfaces on expiry/tenor/strike grids |\n| Calendar Business\
    \ Days | `/calendar-business-days` | List business days for a calendar and date\
    \ range |\n| Calendar Holidays | `/calendar-holidays` | List holidays for a calendar\
    \ and date range |\n| Calendar Advance | `/calendar-advance` | Advance a date\
    \ by period using calendar conventions |\n| Calibrate Swaption Model | `/calibrate-swaption-model`\
    \ | Calibrate Hull-White model parameters from swaption vol surface |\n| Calibrate\
    \ Swaption Vol | `/calibrate-swaption-vol` | Calibrate a SABR swaption volatility\
    \ surface and return diagnostics |\n| Equity Option | `/price-equity-option` |\
    \ Price equity vanilla/barrier options |\n| Zero Coupon Bond | `/price-zero-coupon-bond`\
    \ | Price zero-coupon (single redemption) bonds |\n| Zero Coupon Swap | `/price-zero-coupon-swap`\
    \ | Price zero-coupon fixed-vs-compounded-floating swaps |\n| Year-on-Year Inflation\
    \ Cap/Floor | `/price-year-on-year-inflation-cap-floor` | Price year-on-year inflation\
    \ caps, floors, and collars |\n| Callable Fixed Rate Bond | `/price-callable-fixed-rate-bond`\
    \ | Price callable/puttable fixed-rate bonds on a Hull-White tree |\n| FX Forward\
    \ | `/price-fx-forward` | Price outright FX forwards off an FX spot and two discount\
    \ curves |\n| Cross-Currency Swap | `/price-cross-currency-swap` | Price cross-currency\
    \ swaps (two SwapLeg entries in two currencies, fixed / IBOR / overnight coupons,\
    \ principal exchanges) |\n| Status | `/status` | Runtime health and worker aggregation\
    \ |\n| Meta | `/meta` | Service/version/build metadata |\n| Health | `/health`\
    \ | Lightweight liveness check |\n\n### Quick Start\n\n```bash\n# Health check\n\
    curl http://localhost:8080/health\n\n# Price a fixed rate bond\ncurl -X POST http://localhost:8080/price-fixed-rate-bond\
    \ \\\n  -H \"Content-Type: application/json\" \\\n  -d @examples/data/fixed_rate_bond_request.json\n\
    ```\n"
  version: 0.11.0
  contact:
    name: Quantra API Support
    url: https://github.com/joseprupi/quantraserver
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Bonds
  description: Fixed and floating rate bond pricing
- name: Interest Rate Derivatives
  description: Swaps, FRAs, caps/floors, swaptions
- name: Credit Derivatives
  description: Credit default swaps
- name: Equity Derivatives
  description: Equity option pricing
- name: FX
  description: FX forwards and cross-currency swaps priced off FX spots and per-currency
    discount curves
- name: Curves
  description: Yield curve bootstrapping and rate extraction
- name: Inflation
  description: Inflation curve bootstrap and sampling
- name: Volatility
  description: Volatility surface creation and sampling
- name: Calendars
  description: Calendar business-day, holiday, and date-advance utilities
- name: System
  description: System endpoints
paths:
  /price-fixed-rate-bond:
