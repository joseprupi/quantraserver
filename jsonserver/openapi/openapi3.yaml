    quantra_Schedule:
      type: object
      description: Date schedule definition for payment and accrual dates.
      properties:
        calendar:
          $ref: '#/components/schemas/quantra_enums_Calendar'
        effective_date:
          type: string
        termination_date:
          type: string
        frequency:
          $ref: '#/components/schemas/quantra_enums_Frequency'
        convention:
          $ref: '#/components/schemas/quantra_enums_BusinessDayConvention'
        termination_date_convention:
          $ref: '#/components/schemas/quantra_enums_BusinessDayConvention'
        date_generation_rule:
          $ref: '#/components/schemas/quantra_enums_DateGenerationRule'
        end_of_month:
          type: boolean
          description: 'Presence-required: absent-vs-false silently changes schedule
            dates for

            month-end-anchored (money-market) schedules.'
        first_date:
          type: string
          description: 'Optional. ISO-8601 (YYYY-MM-DD). When present, passed as QuantLib''s

            firstDate, which controls the FIRST stub coupon: with Backward date

            generation a first_date after effective_date creates a short/long first

            period; with Forward generation it anchors the regular periods. Must lie

            strictly between effective_date and termination_date. Omit for no first

            stub (bit-identical to prior behaviour).'
        next_to_last_date:
          type: string
          description: 'Optional. ISO-8601 (YYYY-MM-DD). When present, passed as QuantLib''s

            nextToLastDate, controlling the LAST stub coupon symmetrically to

            first_date. Must lie strictly between effective_date and

            termination_date (and, when first_date is also present, on or after it).

            Omit for no last stub (bit-identical to prior behaviour).'
      additionalProperties: false
    quantra_Period:
      type: object
      description: 'Canonical period type used across APIs. Both fields are presence-required:

        a bare `n` would silently default to 0 and an omitted `unit` would silently

        mean Months, so a forgotten value is a 400 naming the field rather than a

        silent (0 Months) tenor.'
      properties:
        n:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        unit:
          $ref: '#/components/schemas/quantra_enums_TimeUnit'
      additionalProperties: false
    quantra_Yield:
      type: object
      description: Yield/compounding convention specification.
      properties:
        day_counter:
          $ref: '#/components/schemas/quantra_enums_DayCounter'
        compounding:
          $ref: '#/components/schemas/quantra_enums_Compounding'
        frequency:
          $ref: '#/components/schemas/quantra_enums_Frequency'
      additionalProperties: false
    quantra_Error:
      type: object
      description: Error message container.
      properties:
        error_message:
          type: string
      additionalProperties: false
    quantra_FlowInterest:
