name: Build CI Base Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (must match CI_IMAGE in ci.yml)"
        required: true
        default: deps-v2
  push:
    branches: [master]
    paths:
      - Dockerfile
      - tools/quantra-manager/requirements.txt
      - .github/workflows/build-ci-base-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/quantra-ci
  # Bump together with CI_IMAGE in ci.yml whenever the Dockerfile deps change
  # (e.g. a QuantLib upgrade): master keeps using the previous tag until the
  # upgrade branch merges.
  IMAGE_TAG: ${{ github.event.inputs.tag || 'deps-v2' }}

jobs:
  build-and-push:
    name: build-and-push-ci-base
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev-stage image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:deps-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
